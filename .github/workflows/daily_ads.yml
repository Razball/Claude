name: Daily Ad Creator

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    # Adjust this cron to your preferred time zone:
    #   8am EST  = "0 13 * * *"
    #   8am PST  = "0 16 * * *"
    #   8am UTC  = "0 8 * * *"
    - cron: '0 13 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  create-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run ad creation pipeline
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_SOURCE_FOLDER_ID: ${{ secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}

      - name: Upload concept prompts as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concepts-${{ github.run_id }}
          path: concepts_*.txt
          retention-days: 30
